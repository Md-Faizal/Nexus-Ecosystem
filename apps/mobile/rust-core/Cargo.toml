[package]
name = "nexus-mobile-core"
version = "0.1.0"
edition = "2021"
description = "Predominantly-Rust core engine for Nexus Mobile Companion (UniFFI + Tokio + Rustls + SQLite)"

[lib]
name = "nexus_mobile_core"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
nexus-protocol = { path = "../../../crates/nexus-protocol" }
uniffi = { version = "0.28", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"
thiserror = "2.0"
tracing = "0.1"
