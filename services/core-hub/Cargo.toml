[package]
name = "personal-site-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "nexus_core"
path = "src/lib.rs"

[[bin]]
name = "personal-site-rust"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
# bundled = compiles SQLite from source (no host lib needed inside Docker)
rusqlite = { version = "0.31", features = ["bundled"] }
# lettre with rustls (no OpenSSL dependency — smaller image, musl-compatible)
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.31", default-features = false, features = ["system", "disk"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
rand = "0.8"
subtle = "2.5"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
