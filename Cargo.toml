[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "apps/mobile/rust-core",
    "crates/nexus-protocol",
    "services/core-hub",
    "services/watchdog",
]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

[profile.dev]
codegen-units = 256
incremental = true
