name: "⚡ Fast Release: Nexus Agent CLI (Windows, Linux & macOS)"

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/desktop/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'public/releases/**'
      - '.github/workflows/fast-cli-release.yml'

concurrency:
  group: deploy-personal-site
  cancel-in-progress: false

jobs:
  build-linux-agent:
    name: "🐧 Compile Linux Agent Binary"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "🦀 Setup Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "📦 Install Linux GUI System Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxkbcommon-dev

      - name: "⚡ Cache Rust Dependencies"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: "🚀 Compile & Strip Linux Agent"
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "Bumping Nexus Agent to version $VERSION"
          sed -i "s/^version = .*/version = \"$VERSION\"/" apps/desktop/Cargo.toml
          cargo build --release -p nexus-agent
          BIN=$(find . -name nexus -path "*/release/nexus" -not -path "*/target/*/*" | head -n 1)
          if [ -z "$BIN" ] && [ -f target/release/nexus ]; then
            BIN="target/release/nexus"
          elif [ -z "$BIN" ] && [ -f apps/desktop/target/release/nexus ]; then
            BIN="apps/desktop/target/release/nexus"
          fi
          cp "$BIN" ./nexus-linux-amd64
          cp "$BIN" ./nexus-agent-linux-amd64
          chmod +x ./nexus-agent-linux-amd64 ./nexus-linux-amd64
          ls -lh ./nexus-agent-linux-amd64 ./nexus-linux-amd64

      - name: "📦 Upload Linux Agent Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: linux-agent-binaries
          path: |
            nexus-agent-linux-amd64
            nexus-linux-amd64
          retention-days: 1

  build-windows-agent:
    name: "🪟 Compile Windows Agent Binary"
    runs-on: windows-latest
    steps:
      - name: "📥 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "🦀 Setup Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "⚡ Cache Rust Dependencies"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: "🚀 Compile Windows Agent Binary"
        run: |
          $Version = "0.1.${{ github.run_number }}"
          Write-Host "Bumping Windows Nexus Agent to version $Version"
          (Get-Content apps/desktop/Cargo.toml) -replace '^version = .*', "version = `"$Version`"" | Set-Content -Encoding utf8 apps/desktop/Cargo.toml
          cargo build --release -p nexus-agent
          if (Test-Path target/release/nexus.exe) {
            cp target/release/nexus.exe ./nexus-windows-amd64.exe
            cp target/release/nexus.exe ./nexus-agent-windows-amd64.exe
          } elseif (Test-Path apps/desktop/target/release/nexus.exe) {
            cp apps/desktop/target/release/nexus.exe ./nexus-windows-amd64.exe
            cp apps/desktop/target/release/nexus.exe ./nexus-agent-windows-amd64.exe
          }

      - name: "📦 Upload Windows Agent Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: windows-agent-binaries
          path: |
            nexus-agent-windows-amd64.exe
            nexus-windows-amd64.exe
          retention-days: 1

  build-macos-agent:
    name: "🍎 Compile macOS Agent Binary (Universal / ARM64 & Intel)"
    runs-on: macos-latest
    steps:
      - name: "📥 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "🦀 Setup Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: "⚡ Cache Rust Dependencies"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: "🚀 Compile & Build Universal macOS Binary"
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "Bumping macOS Nexus Agent to version $VERSION"
          sed -i '' "s/^version = .*/version = \"$VERSION\"/" apps/desktop/Cargo.toml
          cargo build --release -p nexus-agent --target aarch64-apple-darwin
          cargo build --release -p nexus-agent --target x86_64-apple-darwin
          mkdir -p target/release
          ARM_BIN=$(find . -name nexus -path "*/aarch64-apple-darwin/release/nexus" | head -n 1)
          INTEL_BIN=$(find . -name nexus -path "*/x86_64-apple-darwin/release/nexus" | head -n 1)
          lipo -create -output target/release/nexus-universal "$ARM_BIN" "$INTEL_BIN"
          cp target/release/nexus-universal ./nexus-agent-darwin-arm64
          cp target/release/nexus-universal ./nexus-agent-darwin-amd64
          cp target/release/nexus-universal ./nexus-darwin-arm64
          cp target/release/nexus-universal ./nexus-darwin-amd64
          chmod +x ./nexus*
          ls -lh ./nexus*

      - name: "📦 Upload macOS Agent Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: macos-agent-binaries
          path: |
            nexus-agent-darwin-arm64
            nexus-agent-darwin-amd64
            nexus-darwin-arm64
            nexus-darwin-amd64
          retention-days: 1

  deploy-cli-release:
    name: "🚀 Publish Agent Release to faizal.uk"
    needs: [build-linux-agent, build-windows-agent, build-macos-agent]
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📥 Download Linux Agent Artifact"
        uses: actions/download-artifact@v4
        with:
          name: linux-agent-binaries
          path: .

      - name: "📥 Download Windows Agent Artifact"
        uses: actions/download-artifact@v4
        with:
          name: windows-agent-binaries
          path: .

      - name: "📥 Download macOS Agent Artifact"
        uses: actions/download-artifact@v4
        with:
          name: macos-agent-binaries
          path: .

      - name: "🔧 Prepare Release Binaries & Manifest"
        run: |
          VERSION="0.1.${{ github.run_number }}"
          mkdir -p public/releases
          
          if [ -f ./nexus-agent-linux-amd64 ]; then
            cp ./nexus-agent-linux-amd64 public/releases/nexus-agent-linux-amd64
            cp ./nexus-agent-linux-amd64 public/releases/nexus-agent-linux-x86_64
            cp ./nexus-agent-linux-amd64 public/releases/nexus-linux-amd64
          fi

          if [ -f ./nexus-agent-windows-amd64.exe ]; then
            cp ./nexus-agent-windows-amd64.exe public/releases/nexus-agent-windows-amd64.exe
            cp ./nexus-agent-windows-amd64.exe public/releases/nexus-windows-amd64.exe
          fi

          if [ -f ./nexus-agent-darwin-arm64 ]; then
            cp ./nexus-agent-darwin-arm64 public/releases/nexus-agent-darwin-arm64
            cp ./nexus-agent-darwin-amd64 public/releases/nexus-agent-darwin-amd64
            cp ./nexus-agent-darwin-arm64 public/releases/nexus-darwin-arm64
            cp ./nexus-agent-darwin-amd64 public/releases/nexus-darwin-amd64
          fi

          chmod +x public/releases/nexus*

          if [ -f public/releases/latest.json ]; then
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" public/releases/latest.json
            sed -i "s/\"release_date\": \".*\"/\"release_date\": \"$(date +%Y-%m-%d)\"/" public/releases/latest.json
            echo "Updated public/releases/latest.json to version $VERSION"
          fi

          ls -lh public/releases/

      - name: "🔌 Fast Sync: Rsync Releases directly to faizal.uk"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          elif echo "$SSH_KEY" | grep -q "BEGIN"; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || echo "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          cat << 'EOF' > ~/.ssh/config
          Host production
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            Port 22
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            HostkeyAlgorithms +ssh-rsa,rsa-sha2-256,rsa-sha2-512
          EOF
          chmod 600 ~/.ssh/config

          TARGET_RELEASES_DIR="/home/ubuntu/stack/apps/personal-site/public/releases"

          echo "🚀 Fast-syncing Agent Release binaries to $TARGET_RELEASES_DIR..."
          ssh production "mkdir -p $TARGET_RELEASES_DIR"
          rsync -avz --temp-dir=/tmp public/releases/ production:"$TARGET_RELEASES_DIR/"
          ssh production "chmod -R a+rX $TARGET_RELEASES_DIR"

          echo "✓ Fast Agent Release deployed successfully to https://faizal.uk/releases/latest.json"
